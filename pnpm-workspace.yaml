packages:
  - "apps/*"

allowBuilds:
  core-js-pure: false
  esbuild: true
  puppeteer: true
  sharp: true
  workerd: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@theaiplatform/miniapp-sdk"
  - "@zephyrcloudio/miniapp-zephyr-publisher@2.20.0"
  - "zephyr-agent@1.4.0"
  - "zephyr-edge-contract"
  - "zephyr-rsbuild-plugin"
  - "zephyr-rspack-plugin"
  - "zephyr-xpack-internal"
  - "@cloudflare/vitest-pool-workers@0.18.6"
  - "@cloudflare/vitest-pool-workers@0.21.3"
  - "@types/node@26.1.1"
  - "miniflare@4.20260714.0"
  - "postcss@8.5.26"
  - "vitest@4.1.10"
  - "wrangler@4.112.0"
  - "wrangler@4.123.0"
  - "wrangler@4.119.0"
