  - "@cloudflare/vitest-pool-workers@0.18.6"
  - "@types/node@26.1.1"
  - "miniflare@4.20260714.0"
  - "postcss@8.5.26"
  - "vitest@4.1.10"
  - "wrangler@4.112.0"
  - "wrangler@4.119.0"
