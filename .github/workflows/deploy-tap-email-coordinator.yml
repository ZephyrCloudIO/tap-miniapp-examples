name: Deploy TAP Email Coordinator

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: tap-email-coordinator-production
  queue: max

permissions:
  actions: read
  checks: read
  contents: read
  packages: read

env:
  TAP_EMAIL_COORDINATOR_PRODUCTION_URL: https://tap-email-coordinator.theaiplatform.app

jobs:
  authorize-revision:
    name: Select a CI-approved revision
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy-sha: ${{ steps.revision.outputs.deploy-sha }}
      should-deploy: ${{ steps.revision.outputs.should-deploy }}
    steps:
      - name: Require successful repository CI
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_CHECK_SUITE_ID: ${{ github.event.workflow_run.check_suite_id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            deploy_sha="$WORKFLOW_RUN_SHA"

            read -r before_sha after_sha < <(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/check-suites/${WORKFLOW_RUN_CHECK_SUITE_ID}" \
                --jq '[.before, .after] | @tsv'
            )

            if [[ "$after_sha" != "$deploy_sha" ]]; then
              echo "::error::The completed CI check suite does not match its reported head SHA."
              exit 1
            fi

            changed_paths="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/compare/${before_sha}...${after_sha}" \
                --jq '.files[].filename'
            )"
            changed_path_count="$(wc -l <<< "$changed_paths" | tr -d ' ')"
            should_deploy=false

            while IFS= read -r path; do
              case "$path" in
                .github/workflows/deploy-tap-email-coordinator.yml | \
                  apps/tap-email-coordinator/* | \
                  apps/tap-email-protocol/* | \
                  package.json | \
                  pnpm-lock.yaml | \
                  pnpm-workspace.yaml)
                  should_deploy=true
                  break
                  ;;
              esac
            done <<< "$changed_paths"

            if [[ "$changed_path_count" -ge 300 ]]; then
              echo "::notice::The GitHub comparison reached its 300-file response limit; deploying fail-safe."
              should_deploy=true
            fi
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual production deployments must target the main branch."
              exit 1
            fi

            deploy_sha="$GITHUB_SHA"
            successful_ci_runs="$(
              gh api \
                --method GET \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f branch=main \
                -f event=push \
                -f head_sha="$deploy_sha" \
                -f status=success \
                -f per_page=1 \
                --jq '.total_count'
            )"

            if [[ "$successful_ci_runs" -lt 1 ]]; then
              echo "::error::No successful CI push run exists for ${deploy_sha}; deploy only after CI succeeds for this exact revision."
              exit 1
            fi

            should_deploy=true
          fi

          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The CI-approved deployment revision is not a full commit SHA."
            exit 1
          fi

          echo "Deploying CI-approved revision ${deploy_sha}."
          echo "deploy-sha=${deploy_sha}" >> "$GITHUB_OUTPUT"
          echo "should-deploy=${should_deploy}" >> "$GITHUB_OUTPUT"

  verify-and-deploy:
    needs: authorize-revision
    if: needs.authorize-revision.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: tap-email-coordinator-production
      url: https://tap-email-coordinator.theaiplatform.app
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize-revision.outputs.deploy-sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate production configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_ENCRYPTION_KEY: ${{ secrets.GOOGLE_TOKEN_ENCRYPTION_KEY }}
          ATTACHMENT_STAGING_ENCRYPTION_KEY: ${{ secrets.ATTACHMENT_STAGING_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET \
            GOOGLE_TOKEN_ENCRYPTION_KEY \
            ATTACHMENT_STAGING_ENCRYPTION_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required tap-email-coordinator-production value: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          node --input-type=module <<'NODE'
          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exitCode = 1;
          };

          if (!/^[a-f0-9]{32}$/i.test(process.env.CLOUDFLARE_ACCOUNT_ID ?? '')) {
            fail('CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal account ID.');
          }

          for (const name of [
            'GOOGLE_TOKEN_ENCRYPTION_KEY',
            'ATTACHMENT_STAGING_ENCRYPTION_KEY',
          ]) {
            const value = process.env[name] ?? '';
            if (!/^[A-Za-z0-9_-]{43}$/.test(value)) {
              fail(`${name} must be 32 random bytes encoded as unpadded base64url.`);
              continue;
            }
            const bytes = Buffer.from(value.replaceAll('-', '+').replaceAll('_', '/'), 'base64');
            if (bytes.length !== 32) {
              fail(`${name} must decode to exactly 32 bytes.`);
            }
          }

          if (
            process.env.GOOGLE_TOKEN_ENCRYPTION_KEY ===
            process.env.ATTACHMENT_STAGING_ENCRYPTION_KEY
          ) {
            fail('GOOGLE_TOKEN_ENCRYPTION_KEY and ATTACHMENT_STAGING_ENCRYPTION_KEY must be distinct.');
          }

          try {
            const url = new URL(process.env.TAP_EMAIL_COORDINATOR_PRODUCTION_URL);
            if (
              url.protocol !== 'https:' ||
              url.username ||
              url.password ||
              url.search ||
              url.hash ||
              (url.pathname !== '/' && url.pathname !== '')
            ) {
              fail('TAP_EMAIL_COORDINATOR_PRODUCTION_URL must be an HTTPS origin without credentials, a path, a query, or a fragment.');
            }
          } catch {
            fail('TAP_EMAIL_COORDINATOR_PRODUCTION_URL must be a valid HTTPS origin.');
          }
          NODE

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production Worker
        run: |
          pnpm --filter @tap-examples/tap-email-coordinator types:check
          pnpm --filter @tap-examples/tap-email-coordinator typecheck
          pnpm --filter @tap-examples/tap-email-coordinator test
          pnpm --filter @tap-examples/tap-email-coordinator build:production
          pnpm --filter @tap-examples/tap-email-coordinator check:startup:production

      - name: Ensure production D1 database exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: tap-email-coordinator-production
        run: |
          set -euo pipefail

          database_exists="$({
            pnpm --dir apps/tap-email-coordinator exec wrangler d1 list --json
          } | node --input-type=module -e '
            let body = "";
            for await (const chunk of process.stdin) body += chunk;
            const databases = JSON.parse(body);
            if (!Array.isArray(databases)) throw new Error("Wrangler returned an invalid D1 inventory.");
            process.stdout.write(String(databases.some(database => database.name === process.env.D1_DATABASE_NAME)));
          ')"

          if [[ "$database_exists" == "true" ]]; then
            echo "Production D1 database already exists."
          else
            pnpm --dir apps/tap-email-coordinator exec wrangler d1 create "$D1_DATABASE_NAME"
          fi

      - name: Apply migrations, upload secrets, and deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/tap-email-coordinator
          packageManager: pnpm
          environment: production
          wranglerVersion: "4.123.0"
          secrets: |
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            GOOGLE_TOKEN_ENCRYPTION_KEY
            ATTACHMENT_STAGING_ENCRYPTION_KEY
          preCommands: wrangler d1 migrations apply DB --remote --env production
          command: deploy --env production
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_ENCRYPTION_KEY: ${{ secrets.GOOGLE_TOKEN_ENCRYPTION_KEY }}
          ATTACHMENT_STAGING_ENCRYPTION_KEY: ${{ secrets.ATTACHMENT_STAGING_ENCRYPTION_KEY }}

      - name: Initialize sync delivery and verify production queues
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAP_EMAIL_COORDINATOR_WORKER: tap-email-coordinator-production
          TAP_EMAIL_COMMAND_QUEUE: tap-email-commands-production
          TAP_EMAIL_COMMAND_DLQ: tap-email-commands-dead-letter-production
          TAP_EMAIL_SYNC_QUEUE: tap-email-sync-production
          TAP_EMAIL_SYNC_DLQ: tap-email-sync-dead-letter-production
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const worker = process.env.TAP_EMAIL_COORDINATOR_WORKER;
          const expectedQueues = [
            {
              name: process.env.TAP_EMAIL_COMMAND_QUEUE,
              deadLetterQueue: process.env.TAP_EMAIL_COMMAND_DLQ,
              initializeMissingDelivery: false,
            },
            {
              name: process.env.TAP_EMAIL_SYNC_QUEUE,
              deadLetterQueue: process.env.TAP_EMAIL_SYNC_DLQ,
              initializeMissingDelivery: true,
            },
          ];

          const cloudflare = async (url) => {
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${apiToken}` },
              signal: AbortSignal.timeout(30_000),
            });
            const payload = await response.json();
            if (!response.ok || payload?.success !== true) {
              throw new Error(`Cloudflare API request failed with status ${response.status}.`);
            }
            return payload;
          };

          const queueFor = async (name) => {
            const matches = [];
            let page = 1;
            let totalPages = 1;
            do {
              const inventoryUrl = new URL(
                `/client/v4/accounts/${encodeURIComponent(accountId)}/queues`,
                'https://api.cloudflare.com',
              );
              inventoryUrl.searchParams.set('page', String(page));
              const payload = await cloudflare(inventoryUrl);
              if (!Array.isArray(payload.result)) {
                throw new Error('Cloudflare returned an invalid queue inventory.');
              }
              matches.push(...payload.result.filter(queue => queue?.queue_name === name));
              const reportedPages = Number(payload.result_info?.total_pages);
              if (!Number.isInteger(reportedPages) || reportedPages < 0 || reportedPages > 10_000) {
                throw new Error('Cloudflare returned invalid queue pagination metadata.');
              }
              totalPages = Math.max(1, reportedPages);
              page += 1;
            } while (page <= totalPages);
            if (matches.length !== 1) {
              throw new Error(`Expected exactly one ${name} queue.`);
            }
            return matches[0];
          };

          const metricsFor = async (queue, name) => {
            const metricsUrl = new URL(
              `/client/v4/accounts/${encodeURIComponent(accountId)}/queues/${encodeURIComponent(queue.queue_id)}/metrics`,
              'https://api.cloudflare.com',
            );
            const metrics = (await cloudflare(metricsUrl)).result;
            if (
              !Number.isFinite(metrics?.backlog_count) ||
              !Number.isFinite(metrics?.backlog_bytes) ||
              !Number.isFinite(metrics?.oldest_message_timestamp_ms)
            ) {
              throw new Error(`${name} returned invalid backlog metrics.`);
            }
            return metrics;
          };

          for (const expected of expectedQueues) {
            let queue = await queueFor(expected.name);
            let metrics = await metricsFor(queue, expected.name);
            const deadLetterQueue = await queueFor(expected.deadLetterQueue);
            const deadLetterMetrics = await metricsFor(deadLetterQueue, expected.deadLetterQueue);
            const deliveryState = queue.settings?.delivery_paused === false
              ? 'active'
              : queue.settings?.delivery_paused === true
                ? 'paused'
                : 'missing';
            console.log(
              `${expected.name}: delivery=${deliveryState}; backlog=${metrics.backlog_count} messages (${metrics.backlog_bytes} bytes).`,
            );
            if (queue.settings?.delivery_paused === true) {
              throw new Error(
                `${expected.name} is intentionally paused; refusing to resume it during deployment.`,
              );
            }
            if (queue.settings?.delivery_paused !== false) {
              if (!expected.initializeMissingDelivery) {
                throw new Error(
                  `${expected.name} delivery state is missing; inspect pending outbound commands and the queue backlog, then obtain explicit operator authorization before resuming it.`,
                );
              }
              console.log(`${expected.name}: initializing missing delivery state.`);
              const resumed = spawnSync(
                'pnpm',
                [
                  '--dir',
                  'apps/tap-email-coordinator',
                  'exec',
                  'wrangler',
                  'queues',
                  'resume-delivery',
                  expected.name,
                ],
                { env: process.env, stdio: 'inherit' },
              );
              if (resumed.error || resumed.status !== 0) {
                throw new Error(`Could not initialize ${expected.name} delivery.`);
              }
              for (let attempt = 0; attempt < 6; attempt += 1) {
                queue = await queueFor(expected.name);
                if (queue.settings?.delivery_paused === false) break;
                if (attempt < 5) {
                  await new Promise(resolve => setTimeout(resolve, 2_000));
                }
              }
              metrics = await metricsFor(queue, expected.name);
            }
            if (queue.settings?.delivery_paused !== false) {
              throw new Error(`${expected.name} delivery is still paused.`);
            }
            if (!queue.producers?.some(candidate =>
              candidate?.type === 'worker' && candidate.script === worker
            )) {
              throw new Error(`${expected.name} is missing the ${worker} producer.`);
            }
            if (!queue.consumers?.some(candidate =>
              candidate?.type === 'worker' &&
              (candidate.script_name ?? candidate.script ?? candidate.service) === worker &&
              candidate.dead_letter_queue === expected.deadLetterQueue
            )) {
              throw new Error(`${expected.name} is missing its production consumer or dead-letter queue.`);
            }

            console.log(
              `${expected.name}: delivery active; backlog=${metrics.backlog_count} messages (${metrics.backlog_bytes} bytes).`,
            );
            console.log(
              `${expected.deadLetterQueue}: backlog=${deadLetterMetrics.backlog_count} messages (${deadLetterMetrics.backlog_bytes} bytes).`,
            );
          }
          NODE

      - name: Verify production health and readiness
        shell: bash
        run: |
          set -euo pipefail
          base_url="${TAP_EMAIL_COORDINATOR_PRODUCTION_URL%/}"

          for endpoint in health ready; do
            curl \
              --fail \
              --show-error \
              --silent \
              --retry 12 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              "${base_url}/${endpoint}" | ENDPOINT="$endpoint" node --input-type=module -e '
                let body = "";
                for await (const chunk of process.stdin) body += chunk;
                const payload = JSON.parse(body);
                if (payload.ok !== true || payload.service !== "tap-email-coordinator") {
                  console.error(`::error::/${process.env.ENDPOINT} returned an unexpected response.`);
                  process.exit(1);
                }
              '
          done
