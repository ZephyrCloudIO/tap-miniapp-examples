name: Build and publish TAP Email production package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tap-email-production.yml"
      - ".github/scripts/guard-tap-email-production-artifact.mjs"
      - "apps/tap-email/**"
      - "apps/tap-email-protocol/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read
  packages: read

concurrency:
  group: build-tap-email-production
  cancel-in-progress: false

jobs:
  build:
    name: Assemble production TAP Email package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify the production package
        run: pnpm --filter @tap-examples/tap-email build

      - name: Guard against a dev coordinator origin in the artifact
        run: >-
          node .github/scripts/guard-tap-email-production-artifact.mjs
          apps/tap-email/.tap-package
          apps/tap-email/.tap-build

      - name: Publish to Zephyr Cloud
        env:
          ZE_CI_TOKEN: ${{ secrets.ZE_CI_TOKEN }}
        run: pnpm --filter @tap-examples/tap-email run publish --from .tap-package
